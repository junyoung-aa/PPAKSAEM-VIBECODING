backend:
  name: github
  repo: junyoung-aa/PPAKSAEM-VIBECODING
  branch: main
  base_url: https://ppaksaem-cms-auth.jykwak1213.workers.dev

media_folder: "images"
public_folder: "/images"

collections:
  - name: "programs_data"
    label: "프로그램 관리"
    files:
      - name: "programs"
        label: "프로그램 목록"
        file: "_data/programs.json"
        format: json
        fields:
          - name: "feature_request_form_url"
            label: "기능 요청 구글 폼 URL"
            widget: "string"
            hint: "구글 폼 임베드 URL (?embedded=true 포함)"

          - name: "programs"
            label: "프로그램 목록"
            widget: "list"
            fields:
              - name: "id"
                label: "ID (영문, 고유값, 띄어쓰기 없이)"
                widget: "string"
              - name: "title"
                label: "프로그램 이름"
                widget: "string"
              - name: "description"
                label: "설명"
                widget: "text"
              - name: "status"
                label: "상태"
                widget: "select"
                options:
                  - { label: "배포중", value: "completed" }
                  - { label: "개발 중", value: "in_development" }
              - name: "tags"
                label: "태그"
                widget: "list"
                field:
                  name: "tag"
                  label: "태그"
                  widget: "string"
              - name: "google_form_url"
                label: "신청 구글 폼 URL (완성 프로그램만)"
                widget: "string"
                required: false
                hint: "?embedded=true 로 끝나야 합니다"
              - name: "site_url"
                label: "사이트 URL (웹에서 바로 실행되는 프로그램)"
                widget: "string"
                required: false
                hint: "입력 시 카드에 '🔗 바로가기' 버튼이 생깁니다"
              - name: "download_url"
                label: "다운로드 URL (exe/zip 등 직접 다운로드)"
                widget: "string"
                required: false
                hint: "GitHub Releases 다운로드 링크"
              - name: "guide_url"
                label: "가이드 URL (가이드가 하나일 때)"
                widget: "string"
                required: false
                hint: "입력 시 카드에 '📖 가이드' 버튼이 생깁니다"
              - name: "guides"
                label: "가이드 버튼 여러 개 (한 카드에 프로그램이 둘일 때)"
                widget: "list"
                required: false
                hint: "쌤보드 & 쌤보드 클래스처럼 가이드를 나눠서 보여줄 때 사용합니다. 여기에 값이 있으면 위 '가이드 URL'은 무시됩니다."
                fields:
                  - name: "label"
                    label: "버튼 이름 (예: 쌤보드 가이드)"
                    widget: "string"
                  - name: "url"
                    label: "가이드 주소 (예: /guide/dashboard.html)"
                    widget: "string"
                  - name: "track"
                    label: "클릭 통계 키 (영문, 예: guide-dashboard)"
                    widget: "string"
                    required: false
              - name: "thumbnail"
                label: "썸네일 이미지"
                widget: "image"
                required: false
              - name: "thumbnails"
                label: "썸네일 여러 장 (한 카드에 프로그램이 둘일 때)"
                widget: "list"
                required: false
                hint: "2장을 넣으면 카드 썸네일이 좌우로 나뉘어 보입니다. 비워두면 위 '썸네일 이미지'만 사용합니다."
                field:
                  name: "image"
                  label: "이미지"
                  widget: "image"
              - name: "version"
                label: "버전 (예: 1.0.0)"
                widget: "string"
                required: false
              - name: "version_label"
                label: "버전 표기 직접 입력 (예: 쌤보드 v2.29 · 클래스 v1.9)"
                widget: "string"
                required: false
                hint: "비워두면 위 '버전'이 v1.0 형태로 표시됩니다"
              - name: "release_date"
                label: "최종 배포일 (예: 2026-04-22)"
                widget: "datetime"
                type: date
                required: false
                format: "YYYY-MM-DD"
              - name: "order"
                label: "표시 순서 (숫자가 작을수록 먼저)"
                widget: "number"
                value_type: "int"
              - name: "changelog"
                label: "업데이트 내역"
                widget: "list"
                required: false
                hint: "최신 버전을 맨 위에 추가하세요. 최근 30일 이내 항목이 있으면 카드에 '업데이트' 배지가 표시됩니다."
                fields:
                  - name: "version"
                    label: "버전 (예: 1.2)"
                    widget: "string"
                  - name: "date"
                    label: "업데이트 날짜"
                    widget: "datetime"
                    type: date
                    format: "YYYY-MM-DD"
                  - name: "changes"
                    label: "변경 항목"
                    widget: "list"
                    hint: "항목마다 한 줄씩 입력하세요"
                    field:
                      name: "change"
                      label: "변경 내용"
                      widget: "string"
